<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KASHHT | Coming Soon</title>
  <meta name="description" content="KASHHT is coming soon. We value our customers. Rights reserved 2026.">

  <!-- Google Fonts for High-End Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="assets/kashht-k-mark-black.png">
</head>

<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-mesh" aria-hidden="true">
    <div class="mesh-blob blob-1"></div>
    <div class="mesh-blob blob-2"></div>
  </div>

  <!-- MAIN COMING SOON HERO SECTION (Greyish-White Background & Black Typography) -->
  <main class="hero-section" id="hero">
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="brand-monogram">
        <a href="#hero" class="brand-logo-link" aria-label="KASHHT Home">
          <img src="assets/kashht-logo-black.png" alt="KASHHT Logo" class="nav-logo-img">
        </a>
      </div>
      <div class="header-badges">
        <a href="#rights-section" class="nav-legal-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <path d="M14.83 14.83a4 4 0 1 1 0-5.66" />
          </svg>
          Rights &amp; Privacy
        </a>
      </div>
    </header>

    <div class="hero-container">
      <!-- EXACT REQUIRED THREE-LINE SEQUENCE -->
      <div class="headline-stack">
        <!-- 1. "we value our customers" in next line / top phrase -->
        <p class="tagline-phrase">we value our customers</p>

        <!-- 2. KASHHT wordmark logo in big size -->
        <h1 class="brand-title-wrap" id="brand-heading">
          <img src="assets/kashht-logo-black.png" alt="KASHHT" class="hero-brand-logo">
        </h1>

        <!-- 3. COMING SOON in bold and big letters -->
        <h2 class="coming-soon-heading">COMING SOON</h2>
      </div>

      <!-- Scroll Down Indicator to the Rights Section -->
      <svg class="chevron-down" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      </a>
    </div>
  </main>

  <!-- LOWER SECTION: BLACK BACKGROUND (Rights Reserved & Click-to-Read Privacy Policy) -->
  <footer class="rights-section" id="rights-section">
    <!-- Dark Grid Texture -->
    <div class="dark-grid-overlay" aria-hidden="true"></div>

    <div class="rights-container">
      <!-- Luxury Rights & Privacy Experience Card -->
      <div class="luxury-rights-card">
        <!-- Brand Logo Crest in White -->
        <div class="luxury-emblem-wide">
          <img src="assets/kashht-logo-white.png" alt="KASHHT" class="rights-emblem-logo">
        </div>

        <!-- The Rights Statement (Prominent, Capitalized, Elegant) -->
        <p class="luxury-rights-statement">
          Rights are reserved by <span class="brand-accent-name">KASHHT</span> in 2026
        </p>

        <!-- Divider Line -->
        <div class="luxury-divider" aria-hidden="true"></div>

        <!-- Privacy Policy Link (Opens in New Page) -->
        <div class="luxury-privacy-action">
          <a href="privacy-policy.html" target="_blank" rel="noopener noreferrer" class="luxury-privacy-btn"
            id="privacyPolicyLink" aria-label="Open Privacy Policy in a new tab">
            <svg class="doc-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
            <span>Privacy Policy</span>
            <svg class="external-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
          <span class="action-subtext">Click to read our complete customer privacy charter</span>
        </div>
      </div>

      <!-- Minimal Bottom Brand Strip & Return to Top -->
      <div class="luxury-footer-strip">
        <div class="footer-brand-tag">
          <span class="tag-name">KASHHT</span>
          <span class="tag-sep">•</span>
          <span class="tag-quote">We value our customers</span>
        </div>
        <button type="button" id="backToTopBtn" class="strip-top-btn" aria-label="Back to top">
          <span>Top</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
